<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D6E8C">
<title>Zui Jurnal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap">
<style>
:root{--bg:#EDF0F3;--sf:#fff;--ink:#16202A;--mu:#5F6B77;--ln:#D8DEE4;--ac:#1D6E8C;--ac2:#B9791A;--ok:#2E7D5B;--hi:#C0443A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171E;--sf:#18222B;--ink:#E7ECF0;--mu:#93A0AC;--ln:#2A3743;--ac:#5BB4D2;--ac2:#E0A64A;--ok:#5CC596;--hi:#E5776D}}
:root[data-theme="dark"]{--bg:#10171E;--sf:#18222B;--ink:#E7ECF0;--mu:#93A0AC;--ln:#2A3743;--ac:#5BB4D2;--ac2:#E0A64A;--ok:#5CC596;--hi:#E5776D}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:4px}
.app{max-width:760px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
.top{display:flex;justify-content:space-between;align-items:baseline;padding:14px 20px 0;color:var(--mu);font-size:14px}
.top b{color:var(--ink);font-weight:600;font-size:15px;letter-spacing:.04em}
.hd{overflow:hidden;padding-left:20px}
.hdi{display:flex;gap:26px;position:relative;width:max-content;padding:6px 0 10px;will-change:transform}
.hdi button{font-size:26px;font-weight:300;line-height:1.1;opacity:.4;transition:opacity .2s}
.hdi button.on{opacity:1}
.pv{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.pv::-webkit-scrollbar{display:none}
.pv section{flex:0 0 100%;scroll-snap-align:start;overflow-y:auto;padding:4px 20px 110px}
.sum{color:var(--mu);font-size:15px;margin:0 0 6px}
.big{font-size:56px;font-weight:300;line-height:1;margin:6px 0 2px;color:var(--ac)}
.big small{font-size:28px;color:var(--mu)}
.row{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--ln)}
.row .tx{flex:1;min-width:0}
.row .t{font-size:18px;font-weight:400;overflow-wrap:anywhere}
.row .m{font-size:14px;color:var(--mu);margin-top:2px}
.done .t{text-decoration:line-through;color:var(--mu)}
.x{color:var(--mu);font-size:22px;line-height:1;padding:6px 8px;border-radius:6px}
.x:hover{color:var(--hi)}
.chk{width:26px;height:26px;border:2px solid var(--mu);border-radius:50%;flex:none;display:grid;place-items:center;color:transparent;font-size:15px}
.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--mu)}
.p-Tinggi{background:var(--hi)}.p-Sedang{background:var(--ac2)}.p-Rendah{background:var(--ok)}
.st{font-size:13px;padding:5px 12px;border-radius:99px;border:1px solid var(--ln);white-space:nowrap}
.st-1{border-color:var(--ac);color:var(--ac)}.st-2{background:var(--ok);border-color:var(--ok);color:#fff}
.bar{height:6px;background:var(--ln);border-radius:3px;margin:10px 0 2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:3px;transition:width .25s}
.pg{padding:16px 0;border-bottom:1px solid var(--ln)}
.pg .h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.pg .n{font-size:26px;font-weight:300;color:var(--ac)}
.pg .ctl{display:flex;gap:8px;margin-top:8px;align-items:center}
.pg .ctl button{border:1px solid var(--ln);border-radius:8px;padding:6px 14px;font-size:14px}
.pg .ctl .x{margin-left:auto;border:0}
.mf{padding:18px 0 18px 16px;border-bottom:1px solid var(--ln);border-left:3px solid var(--ac2);margin-top:14px;border-bottom:0;background:none}
.mf .t{font-size:22px;font-weight:300;line-height:1.35;overflow-wrap:anywhere}
.mf.done{border-left-color:var(--ok)}.mf.done .t{text-decoration:none;color:var(--ink)}
.mf .ctl{display:flex;gap:8px;margin-top:10px;align-items:center}
.mf .ctl button.w{border:1px solid var(--ln);border-radius:8px;padding:6px 14px;font-size:14px}
.mf.done .ctl button.w{background:var(--ok);border-color:var(--ok);color:#fff}
.mf .ctl .x{margin-left:auto}
.em{color:var(--mu);padding:28px 0;font-size:16px}
.fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:max(20px,calc(50% - 360px));background:var(--ac);color:#fff;border-radius:99px;padding:14px 22px;font-size:16px;font-weight:500;box-shadow:0 4px 14px rgba(0,0,0,.25)}
:root[data-theme="dark"] .fab,.fab{color:#fff}
dialog{border:0;border-radius:14px;padding:22px;width:min(420px,92vw);background:var(--sf);color:var(--ink)}
dialog::backdrop{background:rgba(10,15,20,.55)}
dialog h2{margin:0 0 14px;font-weight:400;font-size:26px}
dialog label{display:block;font-size:14px;color:var(--mu);margin:12px 0 4px}
dialog input,dialog select{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);font-size:16px}
.act{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.act button{padding:10px 18px;border-radius:8px;font-size:15px}
.act .go{background:var(--ac);color:#fff;font-weight:500}
dialog{max-height:90vh;overflow:auto}
dialog textarea{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);font-size:16px;line-height:1.5;resize:vertical;font-family:inherit}
.sgs{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 12px}
.sg{font-size:14px;padding:6px 14px;border-radius:99px;border:1px solid var(--ln);color:var(--mu)}
.sg.on{border-color:var(--ac2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--ac2)}
.tip{color:var(--mu);font-size:14px;margin:0 0 4px}
details.sc{border-bottom:1px solid var(--ln);padding:14px 0}
details.sc summary{cursor:pointer;list-style:none}
details.sc summary::-webkit-details-marker{display:none}
details.sc .t{display:block;font-size:19px}
details.sc .m{display:block;font-size:14px;color:var(--mu);margin-top:2px}
.bd{white-space:pre-wrap;font-size:18px;font-weight:300;line-height:1.65;margin:12px 0 4px;border-left:3px solid var(--ac2);padding-left:14px}
.sc .ctl{display:flex;gap:8px;margin-top:10px;align-items:center}
.sc .ctl .w{border:1px solid var(--ln);border-radius:8px;padding:6px 14px;font-size:14px}
.sc .ctl .x{margin-left:auto}
@media (max-width:480px){.hdi{gap:16px}.hdi button{font-size:22px}}
.kp{display:grid;grid-template-columns:repeat(3,1fr);margin:6px 0 14px;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.kp div{padding:12px 0 12px 12px;border-left:1px solid var(--ln)}
.kp div:first-child{border-left:0;padding-left:0}
.kp b{display:block;font-size:26px;font-weight:400}
.kp span{font-size:13px;color:var(--mu)}
.late{color:var(--hi);font-weight:500}
.soon{color:var(--ac2);font-weight:500}
.nt{margin-top:4px}
.lnk{margin-top:16px;color:var(--ac);font-size:15px;text-decoration:underline}
.hh{font-size:16px;font-weight:500;margin:22px 0 8px}
.wk{display:flex;gap:8px;height:96px}
.wk>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bx{flex:1;display:flex;align-items:flex-end;width:100%}
.bx i{display:block;width:100%;min-height:3px;background:var(--ac);border-radius:3px 3px 0 0;opacity:.85}
.wk span{font-size:12px;color:var(--mu)}
input[type=range]{width:100%;accent-color:var(--ac);margin:8px 0 0}
.dts{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.dt{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ln)}
.dt.f{background:var(--ok);border-color:var(--ok)}
.dt.h{background:linear-gradient(90deg,var(--ok) 50%,transparent 50%);border-color:var(--ok)}
.pg .ctl button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.vz .ctl{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.vz .w{border:1px solid var(--ln);border-radius:8px;padding:8px 14px;font-size:14px}
.vb{columns:2 150px;column-gap:12px}
.vc{background:var(--sf);border:1px solid var(--ln);border-radius:10px;overflow:hidden;break-inside:avoid;margin-bottom:12px}
.zb{display:block;width:100%}
.vc img{width:100%;height:auto;display:block;cursor:zoom-in}
.vc .ph{width:100%;aspect-ratio:4/5}
.vc .ph{display:grid;place-items:center;font-size:48px;font-weight:300;color:var(--ac2);background:var(--bg)}
.vc .cp{padding:10px}
.vc .ctl{display:flex;gap:6px;align-items:center;margin-top:8px}
.vc .w{border:1px solid var(--ln);border-radius:8px;padding:5px 10px;font-size:13px}
.vc .x{margin-left:auto}
.vc.done{border-color:var(--ok)}
.vc.done .t{text-decoration:none;color:var(--ink)}
.vc.done .w{background:var(--ok);color:#fff;border-color:var(--ok)}
.top{flex-wrap:wrap;gap:2px 12px}
.rt{display:flex;align-items:center;gap:10px}
.gear{font-size:20px;line-height:1;color:var(--mu);padding:2px 6px;border-radius:6px}
.mot{font-style:italic;font-size:15px;margin:0 0 10px}
.hdi button{transition:opacity .25s,transform .3s cubic-bezier(.34,1.56,.64,1);transform-origin:left bottom}
.hdi button.on{animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
.hdi button:active{transform:scale(.9)}
@keyframes pop{0%{transform:scale(.88)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pv section.in>*{animation:rise .4s both}
.pv section.in>*:nth-child(2){animation-delay:.05s}
.pv section.in>*:nth-child(3){animation-delay:.1s}
.pv section.in>*:nth-child(n+4){animation-delay:.15s}
html:root[data-app="light"]{color-scheme:light;--bg:#EDF0F3;--sf:#fff;--ink:#16202A;--mu:#5F6B77;--ln:#D8DEE4;--ac:#1D6E8C;--ac2:#B9791A;--ok:#2E7D5B;--hi:#C0443A}
html:root[data-app="dark"]{color-scheme:dark;--bg:#10171E;--sf:#18222B;--ink:#E7ECF0;--mu:#93A0AC;--ln:#2A3743;--ac:#5BB4D2;--ac2:#E0A64A;--ok:#5CC596;--hi:#E5776D}
#lb{background:transparent;padding:0;border:0;width:auto;max-width:96vw;max-height:94vh;overflow:visible;color:#fff}
#lb img{display:block;max-width:96vw;max-height:84vh;object-fit:contain;border-radius:10px;margin:0 auto}
.lbc{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 4px;font-size:15px}
.lbc button{border:1px solid rgba(255,255,255,.5);border-radius:8px;padding:6px 14px;color:#fff}
.app{max-width:none;margin:0}
.fab{right:20px;font-size:14px;padding:12px 18px}
body{font-size:14px}
.hdi{gap:20px}
.hdi button{font-size:20px}
.top{font-size:12px}
.top{align-items:center}
.top b{font-size:24px;font-weight:600;letter-spacing:.03em;line-height:1.1}
.top small{display:block;font-size:12px;letter-spacing:0;margin-top:3px}
@media (max-width:480px){.top b{font-size:22px}}
.sum,.tip{font-size:13px}
.big{font-size:44px}
.big small{font-size:20px}
.kp b{font-size:20px}
.kp span{font-size:12px}
.row .t,.pg .t,details.sc .t{font-size:15px!important}
.row .m,details.sc .m,.vc .m{font-size:12px}
.pg .n{font-size:20px}
.mf .t{font-size:17px}
.bd{font-size:15px}
.hh{font-size:14px;margin:18px 0 6px}
.st,.sg{font-size:12px}
.em{font-size:14px}
.x{font-size:20px}
.chk{width:22px;height:22px;font-size:13px}
.pg .ctl button,.sc .ctl .w,.mf .ctl button.w,.vz .w,.vc .w{font-size:12px}
.vb{columns:140px}
.vc .t{font-size:14px}
dialog h2{font-size:20px}
dialog label{font-size:12px}
dialog input,dialog select,dialog textarea{font-size:15px}
.act button{font-size:14px}
@media (max-width:480px){.hdi{gap:14px}.hdi button{font-size:17px}}
#tag{cursor:pointer}
#tag:hover{color:var(--ac)!important}
.nc{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:14px}
.nc .m{font-size:12px;color:var(--mu);margin:8px 0 4px}
.mr{display:flex;gap:8px;flex-wrap:wrap}
.mv{min-width:40px;height:40px;border:1px solid var(--ln);border-radius:10px;font-size:20px;transition:transform .15s,background .15s}
.mv:active{transform:scale(.9)}
.mv.on{background:var(--ac);border-color:var(--ac);color:var(--bg)}
.ni{display:block;width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);font-size:14px;margin-top:8px;font-family:inherit}
textarea.ni{resize:vertical;line-height:1.5}
.go2{margin-top:12px;background:var(--ac);color:var(--bg);border-radius:10px;padding:10px 18px;font-size:14px;font-weight:500}
#nq{margin:0 0 6px;background:var(--sf)}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.au{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.ac{width:min(380px,100%)}
.ac h1{font-size:26px;font-weight:600;letter-spacing:.03em;margin:0}
.ac .m{color:var(--mu);font-size:13px;margin:4px 0 18px}
.ac input{display:block;width:100%;padding:12px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);font-size:15px;margin-top:10px}
.ac .go2{width:100%;margin-top:16px;padding:12px}
.am{font-size:13px;margin-top:12px;min-height:18px;color:var(--ok)}
.am.er{color:var(--hi)}
.ed{margin-left:auto!important}
.ed+.x{margin-left:0!important}
#sy{font-size:11px;color:var(--mu)}
.hrow{display:flex;gap:8px;margin:8px 0 4px}
.hrow .ni{margin:0;flex:1}
.hrow .go2{margin:0;padding:10px 16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><b>ZUI JURNAL <small id="tag" class="nt" role="button" tabindex="0" title="Ubah tulisan" onclick="editTag()" onkeydown="if(event.key==='Enter')editTag()" style="font-weight:400;color:var(--mu);letter-spacing:0">Kendalikan diri &amp; terwujud</small></b><span class="rt"><span id="sy"></span><span id="tg"></span><button class="gear" onclick="openSet()" aria-label="Pengaturan">⚙</button></span></div>
  <div class="hd"><div class="hdi" id="hdi" role="tablist"></div></div>
  <div class="pv" id="pv">
    <section id="p0" aria-label="Rencana"></section>
    <section id="p1" aria-label="Proyek"></section>
    <section id="p2" aria-label="Tugas"></section>
    <section id="p3" aria-label="Progres"></section>
    <section id="p4" aria-label="Manifestasi"></section>
    <section id="p5" aria-label="Catatan"></section>
    <section id="p6" aria-label="Hari ini"></section>
  </div>
  <button class="fab" id="fab" onclick="openAdd()"></button>
</div>
<dialog id="dl">
  <h2 id="dt"></h2>
  <label for="ft" id="flt">Judul</label>
  <input id="ft" maxlength="200" autocomplete="off">
  <div id="fbw" style="display:none"><label for="fb">Isi script (tulis dengan kalimat sekarang, lengkap dengan perasaan)</label><textarea id="fb" rows="8" maxlength="4000"></textarea></div>
  <div id="fcw" style="display:none"><label for="fc">Bidang hidup</label><select id="fc"><option value="Karier">Karier</option><option value="Keuangan">Keuangan</option><option value="Hubungan">Hubungan</option><option value="Kesehatan">Kesehatan</option><option value="Spiritual">Spiritual</option><option value="Mimpi">Mimpi</option><option value="Lainnya">Lainnya</option></select></div>
  <div id="fgw" style="display:none"><label for="fg">Target ulangan per hari</label><input id="fg" type="number" min="1" max="999" value="9"></div>
  <div id="fjw" style="display:none"><label for="fj">Proyek terkait</label><select id="fj"></select></div>
  <div id="fiw" style="display:none"><label for="fi">Gambar (opsional)</label><input id="fi" type="file" accept="image/*" onchange="pimg(this)"></div>
  <div id="fdw"><label for="fd">Tanggal target</label><input id="fd" type="date"></div>
  <div id="fpw"><label for="fp">Prioritas</label><select id="fp"><option value="Tinggi">Tinggi</option><option value="Sedang" selected>Sedang</option><option value="Rendah">Rendah</option></select></div>
  <div class="act"><button onclick="dl.close()">Batal</button><button class="go" onclick="add()">Simpan</button></div>
</dialog>
<div id="au" class="au" style="display:none"><form class="ac" onsubmit="return authGo(event)">
<h1>ZUI JURNAL</h1><p class="m">Kendalikan diri & terwujud</p>
<div class="sgs"><button type="button" id="ain" class="sg on" onclick="amode('in')">Masuk</button><button type="button" id="aup" class="sg" onclick="amode('up')">Daftar</button></div>
<input id="ae" type="email" required autocomplete="email" placeholder="Email" aria-label="Email">
<input id="ap" type="password" required minlength="8" autocomplete="current-password" placeholder="Kata sandi (min. 8 karakter)" aria-label="Kata sandi">
<button id="abt" class="go2" type="submit">Masuk</button>
<p id="am" class="am" role="alert"></p>
<button type="button" id="afg" class="lnk" onclick="forgot()">Lupa kata sandi?</button>
</form></div>
<div id="lk" class="au" style="display:none;z-index:200"><form class="ac" onsubmit="return unlock(event)">
<h1>ZUI JURNAL</h1><p class="m">Masukkan PIN</p>
<input id="lkp" type="password" inputmode="numeric" autocomplete="off" maxlength="6" aria-label="PIN">
<button class="go2" type="submit">Buka</button><p id="lkm" class="am er" role="alert"></p></form></div>
<div id="ts" class="toast" role="status"></div>
<dialog id="lb" onclick="this.close()"><img id="lbi" alt=""><div class="lbc"><span id="lbt" class="nt"></span><button>Tutup</button></div></dialog>
<dialog id="sd">
  <h2>Pengaturan</h2>
  <label for="s-lang">Bahasa / Language</label>
  <select id="s-lang"><option value="id">Indonesia</option><option value="en">English</option></select>
  <label for="s-theme">Mode tampilan</label>
  <select id="s-theme"><option value="sys">Sistem</option><option value="light">Terang</option><option value="dark">Gelap</option></select>
  <h3 class="hh">Data diri</h3>
  <label for="s-name">Nama</label><input id="s-name" maxlength="80" autocomplete="name">
  <label for="s-email">Email</label><input id="s-email" type="email" maxlength="120" autocomplete="email">
  <label for="s-dob">Tanggal lahir</label><input id="s-dob" type="date">
  <label for="s-motto">Motto atau tujuan hidup</label><input id="s-motto" maxlength="160">
  <label for="s-tag">Tulisan di bawah nama aplikasi</label><input id="s-tag" maxlength="60" placeholder="Kendalikan diri & terwujud">
  <label for="s-rem">Pengingat harian (jam, kosongkan untuk mati)</label><input id="s-rem" type="time">
  <label for="s-pin">PIN pengunci (4 sampai 6 angka)</label><input id="s-pin" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password" placeholder="PIN baru">
  <button type="button" class="lnk" onclick="pinDel()">Hapus PIN</button>
  <div id="acw" style="display:none"><h3 class="hh">Akun</h3><p class="m" id="acm"></p><button type="button" class="lnk" onclick="logout()">Keluar</button></div>
  <p class="m" style="font-size:13px;color:var(--mu);margin:12px 0 0">Pengaturan ini tersimpan di perangkat ini.</p>
  <div class="act"><button onclick="$('sd').close()">Tutup</button><button class="go" onclick="saveSet()">Simpan</button></div>
</dialog>
<script>
